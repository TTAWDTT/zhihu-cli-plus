name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag input
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r"v\d+\.\d+\.\d+", os.environ["RELEASE_TAG"]), "Use a version tag"
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate independent package and release version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "zhihu-cli-plus"
          assert "v" + project["version"] == os.environ["RELEASE_TAG"]
          PY
      - name: Test and build
        run: |
          python -m pip install -e . pytest ruff build twine
          python -m pytest -q
          ruff check zhihu_cli tests
          ruff format --check zhihu_cli tests
          python -m build
          python -m twine check dist/*
      - name: Prepare checksums and changelog
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          files = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          assert len(files) == 2
          Path("dist/SHA256SUMS").write_text("".join(
              hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n" for p in files))
          section = Path("CHANGELOG.md").read_text().split("## " + os.environ["RELEASE_TAG"][1:] + "\n", 1)[1]
          Path("release-notes.md").write_text(section.split("\n## ", 1)[0].strip() + "\n")
          PY
      - name: Publish GitHub Release
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "zhihu-cli-plus $RELEASE_TAG" --notes-file release-notes.md
