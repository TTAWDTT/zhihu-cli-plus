[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zhihu-cli-plus"
version = "0.8.0"
description = "知乎 CLI Plus：JSON、评论、收藏夹、草稿、回答发布与浏览历史"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "BAIGUANGMEI" }]
maintainers = [{ name = "TTAWDTT" }]
keywords = ["zhihu", "cli", "知乎"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "qrcode>=7.4",
    "click>=8.0",
    "rich>=13.0",
    "pillow>=12.1.1",
]

[project.urls]
Homepage = "https://github.com/TTAWDTT/zhihu-cli-plus"
Repository = "https://github.com/TTAWDTT/zhihu-cli-plus"
Changelog = "https://github.com/TTAWDTT/zhihu-cli-plus/blob/main/CHANGELOG.md"

[project.scripts]
zhihu = "zhihu_cli.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["zhihu_cli"]

[tool.pytest.ini_options]
markers = [
    "integration_dm_write: sends one explicitly approved private message to a specified user",
    "integration: requires valid login session",
    "integration_write: requires explicit approval; creates and cleans up three temporary comments",
    "integration_like: requires explicit approval; likes one specified comment and restores it",
    "integration_workflow_write: requires explicit approval; bounded writes and cleanup on owned fixtures",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
